name: Publish Release

on:
  push:
    branches: ["master"]
    paths:
      - "release.json"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
          components: clippy, rustfmt

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Validate release.json, versions, and tags
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if ! jq -e '.crates | type == "array" and length > 0' release.json >/dev/null; then
            echo "::error::release.json invalid: crates must be a non-empty array"
            exit 1
          fi

          while IFS=' ' read -r name version; do
            echo "Validating $name v$version"

            # Crate must exist in workspace
            if ! cargo metadata --no-deps --format-version 1 \
              | jq -e --arg name "$name" '.packages[] | select(.name == $name)' >/dev/null; then
              echo "::error::Crate $name not found in workspace"
              exit 1
            fi

            # Version must match Cargo.toml
            actual=$(cargo metadata --no-deps --format-version 1 \
              | jq -r --arg name "$name" '.packages[] | select(.name == $name) | .version')

            if [ "$actual" != "$version" ]; then
              echo "::error::Version mismatch for $name: release.json=$version, Cargo.toml=$actual"
              exit 1
            fi

            # Tag must exist on remote
            tag="${name}@${version}"
            echo "Checking tag $tag"
            if ! git ls-remote --tags origin "refs/tags/${tag}" | grep -q "refs/tags/${tag}"; then
              echo "::error::Missing tag: $tag"
              exit 1
            fi
          done < <(jq -r '.crates[] | "\(.name) \(.version)"' release.json)

      - name: Check workspace formatting
        run: cargo fmt --all -- --check

      - name: Test, lint, and publish each crate in order
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail

          while IFS=' ' read -r name version; do
            echo "=========================================="
            echo "Processing $name v$version"
            echo "=========================================="

            # Test
            cargo test -p "$name" --all-targets || {
              echo "::error::Tests failed for $name"
              exit 1
            }

            # Clippy
            cargo clippy -p "$name" --all-targets -- -D warnings || {
              echo "::error::Clippy failed for $name"
              exit 1
            }

            # Publish
            cargo publish -p "$name" --locked || {
              echo "::error::Publish failed for $name"
              exit 1
            }

            echo "Successfully published $name v$version"
          done < <(jq -r '.crates[] | "\(.name) \(.version)"' release.json)
