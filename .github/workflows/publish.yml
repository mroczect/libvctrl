name: Publish to crates.io

on:
  push:
    tags:
      - "libvctrl@*"
      - "libvctrl_core@*"
      - "libvctrl_handler@*"
      - "libvctrl_plumbing@*"
      - "libvctrl_porcelain@*"
      - "libvctrl_sha512@*"

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v6

      - name: Extract crate name and version from tag
        id: parse
        run: |
          TAG="${{ github.ref_name }}"
          CRATE_NAME=$(echo "$TAG" | cut -d'@' -f1)
          VERSION=$(echo "$TAG" | cut -d'@' -f2)
          if [ -z "$CRATE_NAME" ] || [ -z "$VERSION" ]; then
            echo "Error: tag must be in format 'crate@version' (e.g., libvctrl_sha512@0.1.0)"
            exit 1
          fi
          echo "crate_name=$CRATE_NAME" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION"      >> "$GITHUB_OUTPUT"
          echo "Detected crate: $CRATE_NAME, version: $VERSION"

      - name: Verify version matches Cargo.toml
        run: |
          CRATE="${{ steps.parse.outputs.crate_name }}"
          if [ ! -d "$CRATE" ]; then
            echo "Error: directory '$CRATE' does not exist"
            exit 1
          fi
          cd "$CRATE"
          MANIFEST_VERSION=$(cargo pkgid | cut -d'#' -f2 | cut -d: -f1)
          TAG_VERSION="${{ steps.parse.outputs.version }}"
          if [ "$MANIFEST_VERSION" != "$TAG_VERSION" ]; then
            echo "Error: tag version '$TAG_VERSION' != Cargo.toml version '$MANIFEST_VERSION'"
            exit 1
          fi
          echo "Version verified: $MANIFEST_VERSION"

      - name: Publish crate
        run: cargo publish -p "${{ steps.parse.outputs.crate_name }}"
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
