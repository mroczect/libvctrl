name: Publish to crates.io

on:
  push:
    tags:
      - 'libvctrl[0-9]*'
      - 'libvctrl_core[0-9]*'
      - 'libvctrl_handler[0-9]*'
      - 'libvctrl_plumbing[0-9]*'
      - 'libvctrl_porcelain[0-9]*'

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v6

      - name: Extract crate name and version from tag
        id: parse
        run: |
          TAG="${{ github.ref_name }}"
          POS=$(echo "$TAG" | grep -b -o '[0-9]' | head -1 | cut -d: -f1)
          if [ -z "$POS" ]; then
            echo "Error: could not find version in tag '$TAG'"
            exit 1
          fi
          CRATE_NAME="${TAG:0:$POS}"
          VERSION="${TAG:$POS}"
          echo "crate_name=$CRATE_NAME" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION"      >> "$GITHUB_OUTPUT"
          echo "Detected crate: $CRATE_NAME, version: $VERSION"

      - name: Verify version matches Cargo.toml
        run: |
          cd "${{ steps.parse.outputs.crate_name }}"
          MANIFEST_VERSION=$(cargo pkgid | cut -d'#' -f2 | cut -d: -f1)
          TAG_VERSION="${{ steps.parse.outputs.version }}"
          if [ "$MANIFEST_VERSION" != "$TAG_VERSION" ]; then
            echo "Error: tag version '$TAG_VERSION' != Cargo.toml version '$MANIFEST_VERSION'"
            exit 1
          fi
          echo "Version verified: $MANIFEST_VERSION"

      - name: Publish crate
        run: cargo publish -p "${{ steps.parse.outputs.crate_name }}"
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}