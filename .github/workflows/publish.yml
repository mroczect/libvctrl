name: Publish Release

on:
  push:
    branches: ["master"]
    paths:
      - "release.json"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Validate release.json and tags
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! jq -e '.crates | type == "array" and length > 0' release.json >/dev/null; then
            echo "::error::release.json invalid: crates must be a non-empty array"
            exit 1
          fi

          while read -r name version; do
            tag="${name}@${version}"
            echo "Checking tag $tag"
            if ! git ls-remote --tags origin "refs/tags/${tag}" | grep -q "refs/tags/${tag}"; then
              echo "::error::Missing tag: $tag"
              exit 1
            fi
          done < <(jq -r '.crates[] | "\(.name) \(.version)"' release.json)

      - name: Test and publish each crate in order
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          while read -r name version; do
            echo "=========================================="
            echo "Processing $name v$version"
            echo "=========================================="

            # Build & test
            cargo test -p "$name" --all-targets || {
              echo "::error::Tests failed for $name"
              exit 1
            }

            # Clippy with warnings denied
            cargo clippy -p "$name" --all-targets -- -D warnings || {
              echo "::error::Clippy failed for $name"
              exit 1
            }

            # Publish
            cargo publish -p "$name" || {
              echo "::error::Publish failed for $name"
              exit 1
            }

            echo "Successfully published $name v$version"
          done < <(jq -r '.crates[] | "\(.name) \(.version)"' release.json)
