[package]
name = "libvctrl_core"
version = "3.0.1"
edition = "2024"
description = "Reference implementations of the libvctrl contracts (in-memory store, SHA-512 hasher, binary codec)"
license = "MIT"
authors = ["mroczect"]
repository = "https://github.com/mroczect/libvctrl"
readme = "README.md"
keywords = ["version-control", "vcs", "core"]
categories = ["development-tools"]

[dependencies]
libvctrl_handler = {path = "../libvctrl_handler", version = "5.0.1" }
libvctrl_sha512 = { path = "../libvctrl_sha512", version = "3.1.0" }

[dev-dependencies]
proptest = "1.11.0"

[lints]
workspace = true
