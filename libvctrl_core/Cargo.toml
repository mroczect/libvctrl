[package]
name = "libvctrl_core"
version = "0.2.0"
edition = "2024"
description = "Reference implementations of the libvctrl contracts (in-memory store, SHA-512 hasher, binary codec)"
license = "MIT"
authors = ["mroczect"]
repository = "https://github.com/mroczect/libvctrl"
readme = "README.md"
keywords = ["version-control", "vcs", "core"]
categories = ["development-tools"]

[dependencies]
libvctrl_handler = {path = "../libvctrl_handler", version = "1.0.2" }
libvctrl_sha512 = { path = "../libvctrl_sha512", version = "0.2.0" }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"
unused_qualifications = "warn"
trivial_casts = "warn"
trivial_numeric_casts = "warn"
unused_results = "warn"
rust_2018_idioms = "warn"

[lints.clippy]
pedantic = "warn"
nursery = "warn"
cargo = "warn"