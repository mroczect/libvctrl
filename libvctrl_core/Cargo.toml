[package]
name = "libvctrl_core"
version = "1.1.0"
edition = "2024"
description = "Reference implementations of the libvctrl contracts (in-memory store, SHA-512 hasher, binary codec)"
license = "MIT"
authors = ["mroczect"]
repository = "https://github.com/mroczect/libvctrl"
readme = "README.md"
keywords = ["version-control", "vcs", "core"]
categories = ["development-tools"]

[dependencies]
libvctrl_handler = {path = "../libvctrl_handler", version = "3.1.1" }
libvctrl_sha512 = { path = "../libvctrl_sha512", version = "2.0.0" }

[dev-dependencies]
proptest = "1.11.0"

[lints.clippy]
all = "deny"
pedantic = "deny"
nursery = "deny"
cargo = "deny"