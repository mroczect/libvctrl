[workspace]
resolver = "2"
members = ["libvctrl","libvctrl_core","libvctrl_handler", "libvctrl_plumbing", "libvctrl_porcelain", "libvctrl_sha512"]

[workspace.package]
edition = "2024"
rust-version = "1.96"
license = "MIT"
authors = ["mroczect"]
repository = "https://github.com/mroczect/libvctrl"
homepage = "https://github.com/mroczect/libvctrl"
documentation = "https://docs.rs/libvctrl"
keywords = ["git", "vcs", "cryptography", "sha512", "no-std"]
categories = ["development-tools", "cryptography", "algorithms", "no-std"]

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"
missing_doc_code_examples = "warn"
dead_code = "deny"
unused_imports = "deny"
unused_variables = "deny"
unused_lifetimes = "deny"
unused_macro_rules = "deny"
unused_crate_dependencies = "deny"
unreachable_pub = "deny"
rust_2018_idioms = { level = "deny", priority = -1 }
elided_lifetimes_in_paths = "deny"
explicit_outlives_requirements = "deny"
non_ascii_idents = "deny"
trivial_bounds = "deny"
unit_bindings = "deny"
macro_use_extern_crate = "forbid"
single_use_lifetimes = "warn"
redundant_lifetimes = "deny"
rust_2021_compatibility = { level = "warn", priority = -1 }
rust_2024_compatibility = { level = "warn", priority = -1 }
unused_qualifications = "deny"
noop_method_call = "deny"
unnameable_types = "warn"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }
missing_errors_doc = "deny"
missing_panics_doc = "deny"
missing_safety_doc = "deny"
missing_fields_in_debug = "deny"
doc_markdown = "deny"
missing_const_for_fn = "deny"
must_use_candidate = "deny"
must_use_unit = "deny"
cast_possible_truncation = "deny"
cast_possible_wrap = "deny"
cast_sign_loss = "deny"
cast_precision_loss = "deny"
cast_lossless = "warn"
ptr_as_ptr = "deny"
ptr_cast_constness = "deny"
fn_to_numeric_cast_with_truncation = "deny"
char_lit_as_u8 = "deny"
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
indexing_slicing = "warn"
range_minus_one = "deny"
range_plus_one = "deny"
str_to_string = "deny"
implicit_clone = "deny"
clone_on_ref_ptr = "deny"
format_push_string = "deny"
single_char_add_str = "deny"
string_add = "warn"
string_lit_chars_any = "deny"
zero_sized_map_values = "deny"
or_fun_call = "deny"
unnecessary_to_owned = "deny"
manual_string_new = "deny"
redundant_clone = "deny"
needless_continue = "deny"
needless_return = "deny"
match_same_arms = "deny"
match_bool = "deny"
match_wild_err_arm = "deny"
wildcard_enum_match_arm = "warn"
if_not_else = "warn"
else_if_without_else = "warn"
question_mark_used = "allow"
explicit_iter_loop = "deny"
explicit_into_iter_loop = "deny"
filter_map_next = "deny"
flat_map_option = "deny"
map_unwrap_or = "deny"
iter_with_drain = "deny"
for_kv_map = "deny"
default_trait_access = "deny"
use_self = "deny"
self_named_constructors = "deny"
pub_without_shorthand = "deny"
redundant_pub_crate = "deny"
ref_option_ref = "deny"
trivially_copy_pass_by_ref = "warn"
large_types_passed_by_value = "warn"
option_if_let_else = "deny"
single_match_else = "warn"
enum_glob_use = "deny"
items_after_statements = "deny"
map_err_ignore = "deny"
semicolon_if_nothing_returned = "deny"
checked_conversions = "deny"
float_cmp = "deny"
print_stdout = "deny"
print_stderr = "deny"
dbg_macro = "deny"
std_instead_of_alloc = "warn"
std_instead_of_core = "deny"
alloc_instead_of_core = "deny"
empty_drop = "deny"
empty_structs_with_brackets = "deny"
exit = "deny"
shadow_unrelated = "warn"
shadow_reuse = "warn"
unseparated_literal_suffix = "deny"
