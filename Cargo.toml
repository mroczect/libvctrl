[workspace]
members = [
  "libvctrl",
  "libvctrl_core",
  "libvctrl_handler",
  "libvctrl_plumbing",
  "libvctrl_porcelain",
  "libvctrl_sha512"
]
resolver = "2"

[workspace.lints.clippy]
all = "deny"
alloc_instead_of_core = "deny"
allow_attributes = "allow"
allow_attributes_without_reason = "allow"
arithmetic_side_effects = "deny"
cargo = "deny"
complexity = "deny"
correctness = "deny"
doc_lazy_continuation = "allow"
doc_markdown = "allow"
empty_docs = "allow"
expect_used = "deny"
implicit_hasher = "allow"
indexing_slicing = "deny"
map_err_ignore = "deny"
match_same_arms = "allow"
missing_docs_in_private_items = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
missing_safety_doc = "allow"
module_name_repetitions = "allow"
needless_doctest_main = "allow"
needless_return = "allow"
nursery = "deny"
panic = "deny"
pedantic = "deny"
perf = "deny"
restriction = "deny"
std_instead_of_alloc = "deny"
std_instead_of_core = "deny"
style = "deny"
suspicious = "deny"
uninlined_format_args = "allow"
unwrap_used = "deny"
wildcard_enum_match_arm = "deny"

[workspace.lints.rust]
deprecated = "deny"
elided_lifetimes_in_paths = "deny"
explicit_outlives_requirements = "deny"
future_incompatible = "deny"
invalid_reference_casting = "deny"
macro_use_extern_crate = "deny"
missing_copy_implementations = "deny"
missing_debug_implementations = "deny"
missing_docs = "allow"
no_mangle_generic_items = "deny"
non_ascii_idents = "deny"
non_camel_case_types = "deny"
non_snake_case = "deny"
non_upper_case_globals = "deny"
noop_method_call = "deny"
overlapping_range_endpoints = "deny"
private_bounds = "deny"
private_interfaces = "deny"
redundant_lifetimes = "deny"
renamed_and_removed_lints = "deny"
rust_2018_idioms = "deny"
rust_2021_compatibility = "deny"
rust_2024_compatibility = "deny"
single_use_lifetimes = "deny"
trivial_bounds = "deny"
trivial_casts = "deny"
trivial_numeric_casts = "deny"
unaligned_references = "deny"
unexpected_cfgs = "deny"
uninhabited_static = "deny"
unit_bindings = "deny"
unknown_lints = "deny"
unnameable_types = "deny"
unreachable_code = "deny"
unreachable_patterns = "deny"
unreachable_pub = "deny"
unsafe_code = "forbid"
unsafe_op_in_unsafe_fn = "deny"
unused = "deny"
unused_allocation = "deny"
unused_assignments = "deny"
unused_braces = "deny"
unused_comparisons = "deny"
unused_crate_dependencies = "deny"
unused_doc_comments = "allow"
unused_extern_crates = "deny"
unused_features = "deny"
unused_imports = "deny"
unused_labels = "deny"
unused_lifetimes = "deny"
unused_macro_rules = "deny"
unused_macros = "deny"
unused_must_use = "deny"
unused_mut = "deny"
unused_parens = "deny"
unused_qualifications = "deny"
unused_results = "deny"
unused_tuple_struct_fields = "deny"
unused_unsafe = "deny"
unused_variables = "deny"
warnings = "deny"

  [workspace.package]
  authors = [ "mroczect" ]
  categories = [ "development-tools", "cryptography", "algorithms", "no-std" ]
  documentation = "https://docs.rs/libvctrl"
  edition = "2024"
  homepage = "https://github.com/mroczect/libvctrl"
  keywords = [ "git", "vcs", "cryptography", "sha512", "no-std" ]
  license = "MIT"
  repository = "https://github.com/mroczect/libvctrl"
  rust-version = "1.96"
